# PNG -> BMP cover converter (lib/PngToBmpConverter: crosspoint's own chunk/IHDR/filter/palette
# decoder, inflating through lib/miniz InflateStream). Fed by EPUB/TXT cover images from the SD
# card. Platform shims: memory-backed HalFile (stubs/memfile), vTaskDelay + display size
# (stubs/img), Logging/Print/Arduino from upstream's test/chapter_html_slim_parser/stubs.
NAME=fuzz_png
SRCS=(lib/PngToBmpConverter/PngToBmpConverter.cpp lib/GfxRenderer/BitmapHelpers.cpp lib/miniz/src/InflateStream.cpp lib/miniz/src/miniz_impl.c lib/Memory/BuildScratch.cpp lib/hal/HalMemory.cpp)
INCS=(mayhem/harnesses/stubs/img mayhem/harnesses/stubs/memfile test/chapter_html_slim_parser/stubs lib/PngToBmpConverter lib/GfxRenderer lib/Memory lib/hal lib/miniz/src test/inflate_stream/stubs)
EXTRA=(-fno-exceptions)
# lib/miniz does NULL+0 pointer arithmetic on every inflate: pointer-overflow relaxed for miniz only.
TP_PREFIX=(lib/miniz/)
TP_EXTRA=(-fno-sanitize=pointer-overflow)
