# EPUB container.xml, NCX and EPUB3 nav table-of-contents parsers (lib/Epub/Epub/parsers).
# As upstream's test/content_opf_parser harness style: vendored expat, upstream Print/FsHelpers/Logging stubs,
# plus a tiny recording BookMetadataCache stub (mayhem/harnesses/stubs/toc).
NAME=fuzz_toc
SRCS=(lib/Epub/Epub/parsers/TocNcxParser.cpp lib/Epub/Epub/parsers/TocNavParser.cpp lib/Epub/Epub/parsers/ContainerParser.cpp lib/expat/xmlparse.c lib/expat/xmlrole.c lib/expat/xmltok.c)
INCS=(mayhem/harnesses/stubs/toc test/content_opf_parser/stubs lib/Epub/Epub/parsers lib/XmlParserUtils lib/expat)
DEFS=(XML_CONTEXT_BYTES=0 XML_GE=0)
# Vendored expat does `m_buffer + nLeftOver` with a null m_buffer and nLeftOver == 0 (xmlparse.c:2173, UB but
# benign); keep that one UBSan check off so fuzzing is not stopped by it on every near-empty document.
EXTRA=(-fno-exceptions)
# lib/expat/xmlparse.c does NULL+0 pointer arithmetic (XML_Parse(p, NULL, 0, final) with
# XML_CONTEXT_BYTES=0 on every document end): pointer-overflow is relaxed for expat only.
TP_PREFIX=(lib/expat/)
TP_EXTRA=(-fno-sanitize=pointer-overflow)
