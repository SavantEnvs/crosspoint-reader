# EPUB chapter XHTML -> pages (ChapterHtmlSlimParser + CSS + ParsedText line breaking + Page serialize).
# Source list/includes as upstream's test/chapter_html_slim_parser/CMakeLists.txt (minus the dictionary-page test
# sources), vendored expat, and a memory-backed HalStorage (mayhem/harnesses/stubs/mem) instead of the host-fs one.
NAME=fuzz_chapterhtml
SRCS=(
  test/chapter_html_slim_parser/ParserLinkStubs.cpp
  lib/Epub/Epub/Page.cpp
  lib/Epub/Epub/blocks/TextBlock.cpp
  lib/Epub/Epub/CjkBreaks.cpp
  lib/MiniBidi/BidiUtils.cpp
  lib/MiniBidi/minibidi.c
  lib/Epub/Epub/parsers/ChapterHtmlSlimParser.cpp
  lib/Epub/Epub/css/CssParser.cpp
  lib/Epub/Epub/ParsedText.cpp
  lib/Epub/Epub/WordStore.cpp
  lib/Epub/Epub/converters/ImageDimsProbe.cpp
  lib/Epub/Epub/converters/ImageToFramebufferDecoder.cpp
  lib/Utf8/Utf8.cpp
  lib/expat/xmlparse.c lib/expat/xmlrole.c lib/expat/xmltok.c
)
INCS=(
  mayhem/harnesses/stubs/mem
  test/chapter_html_slim_parser/stubs
  src lib lib/Epub lib/Epub/Epub lib/Epub/Epub/parsers lib/Epub/Epub/css lib/AsciiText lib/EpdFont lib/Utf8
  lib/Memory lib/Serialization lib/MiniBidi lib/FsHelpers lib/XmlParserUtils lib/expat
)
DEFS=(XML_CONTEXT_BYTES=0 XML_GE=0)
# Vendored expat does `m_buffer + nLeftOver` with a null m_buffer and nLeftOver == 0 (xmlparse.c:2173, UB but
# benign); keep that one UBSan check off so fuzzing is not stopped by it on every near-empty document.
EXTRA=(-fno-exceptions)
# lib/expat/xmlparse.c does NULL+0 pointer arithmetic (XML_Parse(p, NULL, 0, final) with
# XML_CONTEXT_BYTES=0 on every document end): pointer-overflow is relaxed for expat only.
TP_PREFIX=(lib/expat/)
TP_EXTRA=(-fno-sanitize=pointer-overflow)
