# GIF -> BMP converter (lib/GifToBmpConverter + AnimatedGIF decoder). Sources/includes as upstream's
# test/gif_support GifBmpTest; AnimatedGIF is the pinned, patched copy that mayhem/build.sh
# creates in mayhem/build-tests/animatedgif (scripts/patch_animatedgif.py). HalFile is the
# memory-backed stub in mayhem/harnesses/stubs/memfile.
NAME=fuzz_gif
SRCS=(lib/GifToBmpConverter/GifToBmpConverter.cpp lib/GfxRenderer/BitmapHelpers.cpp mayhem/build-tests/animatedgif/src/AnimatedGIF.cpp)
INCS=(mayhem/harnesses/stubs/memfile test/gif_support/stubs test/chapter_html_slim_parser/stubs lib/GifToBmpConverter lib/GifSupport lib/GfxRenderer lib/Memory mayhem/build-tests/animatedgif/src)
DEFS=(__LINUX__ MAX_WIDTH=3072)
# AnimatedGIF's LZW decoder does unaligned uint64_t loads on every valid GIF (gif.inl, benign on the
# targets); only UBSan's alignment check is disabled.
EXTRA=(-fno-exceptions)
# AnimatedGIF (third-party, gif.inl) does unaligned uint64 loads on every GIF: alignment relaxed for it only.
TP_PREFIX=(mayhem/build-tests/animatedgif/)
TP_EXTRA=(-fno-sanitize=alignment)
