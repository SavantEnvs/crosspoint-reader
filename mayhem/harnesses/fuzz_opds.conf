# OPDS feed parser (freeink-sdk/libs/network/Opds): format-sniffing OpdsFeedParser dispatching to
# the OPDS 1.x Atom parser (vendored expat) and the OPDS 2.0 JSON parser (JsonSax). Sources and
# stubs as the SDK's own host test (freeink-sdk/libs/network/Opds/test/host/run.sh), with the
# vendored expat as in test/koreader_xpath_resolver/CMakeLists.txt.
NAME=fuzz_opds
SRCS=(freeink-sdk/libs/network/Opds/src/OpdsFeedParser.cpp freeink-sdk/libs/network/Opds/src/OpdsParser.cpp
      freeink-sdk/libs/network/Opds/src/Opds2Parser.cpp freeink-sdk/libs/network/JsonSax/src/StreamingJsonParser.cpp
      lib/expat/xmlparse.c lib/expat/xmlrole.c lib/expat/xmltok.c)
INCS=(freeink-sdk/libs/network/Opds/test/host/stubs freeink-sdk/libs/network/Opds/include
      freeink-sdk/libs/network/JsonSax/include lib/expat)
DEFS=(XML_GE=0 XML_CONTEXT_BYTES=0)
# OpdsParser::flush() finishes the document with XML_Parse(parser, nullptr, 0, XML_TRUE), the
# documented idiom; with XML_CONTEXT_BYTES=0 the vendored expat then evaluates `NULL + 0`
# (xmlparse.c: callProcessor(... s + len ...)), which UBSan's pointer-overflow check flags on every
# well-formed Atom feed. Benign in practice, so that one check is off for this target.
EXTRA=()
# lib/expat/xmlparse.c does NULL+0 pointer arithmetic (XML_Parse(p, NULL, 0, final) with
# XML_CONTEXT_BYTES=0 on every document end): pointer-overflow is relaxed for expat only.
TP_PREFIX=(lib/expat/)
TP_EXTRA=(-fno-sanitize=pointer-overflow)
