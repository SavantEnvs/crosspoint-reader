# EPUB container reader (lib/ZipFile) + miniz inflate. Source list and stubs as upstream's
# test/zip_file/CMakeLists.txt.
NAME=fuzz_zipfile
SRCS=(lib/ZipFile/ZipFile.cpp lib/miniz/src/InflateStream.cpp lib/miniz/src/miniz_impl.c lib/Memory/BuildScratch.cpp lib/hal/HalMemory.cpp)
INCS=(test/zip_file/stubs lib/ZipFile lib/Memory lib/hal lib/miniz/src)
# ZipFile::loadZipDetails scans for the EOCD signature with an unaligned uint32_t load on every
# valid archive (benign on the target); silence only UBSan's alignment check so real findings surface.
# Likewise vendored miniz tinfl_decompress does `pIn_buf_next + *pIn_buf_size` with a null input and
# size 0 when an entry's compressed data is empty/exhausted (benign null+0); pointer-overflow is off.
EXTRA=(-fno-exceptions -fno-sanitize=alignment)
# lib/miniz does NULL+0 pointer arithmetic on every inflate: pointer-overflow relaxed for miniz only.
TP_PREFIX=(lib/miniz/)
TP_EXTRA=(-fno-sanitize=pointer-overflow)
