# JPEG -> BMP cover converter (lib/JpegToBmpConverter + JPEGDEC). JPEGDEC is the commit pinned in
# platformio.ini, cached in /opt/toolchains/deps and copied by mayhem/build.sh into
# mayhem/build-tests/jpegdec with upstream's scripts/jpegdec_patches applied (as
# scripts/patch_jpegdec.py does for the firmware). Same platform shims as fuzz_png.
NAME=fuzz_jpeg
SRCS=(lib/JpegToBmpConverter/JpegToBmpConverter.cpp lib/GfxRenderer/BitmapHelpers.cpp mayhem/build-tests/jpegdec/src/JPEGDEC.cpp)
INCS=(mayhem/harnesses/stubs/img mayhem/harnesses/stubs/memfile test/chapter_html_slim_parser/stubs lib/JpegToBmpConverter lib/GfxRenderer lib/Memory mayhem/build-tests/jpegdec/src)
DEFS=(__LINUX__)
EXTRA=(-fno-exceptions)
# JPEGDEC (third-party, jpeg.inl MOTOSHORT/MOTOLONG with ALLOWS_UNALIGNED on x86) does unaligned
# uint16/uint32 loads on every JPEG, and JPEGHuffmanBuild (jpeg.inl:1115) evaluates
# `cc >> (iBitNum-5)` with a negative exponent for every 1..4-bit DC code: alignment and
# shift-exponent are relaxed for JPEGDEC only (as alignment is for AnimatedGIF in fuzz_gif).
TP_PREFIX=(mayhem/build-tests/jpegdec/)
TP_EXTRA=(-fno-sanitize=alignment,shift-exponent)
