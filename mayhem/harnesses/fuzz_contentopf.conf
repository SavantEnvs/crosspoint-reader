# EPUB package document (content.opf) parser + encryption.xml probe (lib/Epub/Epub/parsers).
# As upstream's test/content_opf_parser (vendored expat instead of system EXPAT); memory-backed Storage and the
# real lib/Serialization so the manifest item-cache / spine path (cache != nullptr) is exercised too.
NAME=fuzz_contentopf
SRCS=(lib/Epub/Epub/parsers/ContentOpfParser.cpp lib/expat/xmlparse.c lib/expat/xmlrole.c lib/expat/xmltok.c)
INCS=(mayhem/harnesses/stubs/opf mayhem/harnesses/stubs/mem lib/Serialization test/content_opf_parser/stubs lib/Epub/Epub/parsers lib/XmlParserUtils lib/expat)
DEFS=(XML_CONTEXT_BYTES=0 XML_GE=0)
# Vendored expat does `m_buffer + nLeftOver` with a null m_buffer and nLeftOver == 0 (xmlparse.c:2173, UB but
# benign); keep that one UBSan check off so fuzzing is not stopped by it on every near-empty document.
EXTRA=(-fno-exceptions)
# lib/expat/xmlparse.c does NULL+0 pointer arithmetic (XML_Parse(p, NULL, 0, final) with
# XML_CONTEXT_BYTES=0 on every document end): pointer-overflow is relaxed for expat only.
TP_PREFIX=(lib/expat/)
TP_EXTRA=(-fno-sanitize=pointer-overflow)
